<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home — Acceptance Demo</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">Demo</a>
    <nav>
      <a href="/">首页</a>
      <a href="/about">关于</a>
    </nav>
  </header>

  <main>
    <h1>首页</h1>
    <p class="lede">Phase 0 验收页：在窄视口下主按钮容器会横向溢出。</p>

    <!-- INTENTIONAL L3 BUG: min-width forces overflow at 375px -->
    <section class="cta-row" data-testid="cta-row">
      <button type="button" class="btn btn-primary" data-testid="primary-cta">
        立即开始超长按钮文案演示溢出
      </button>
      <button type="button" class="btn btn-secondary">次要操作</button>
    </section>

    <article class="card">
      <h2>卡片</h2>
      <p>普通内容区，不应溢出。</p>
    </article>

    <!-- INTENTIONAL Phase 1: tiny touch target -->
    <section class="tool-row">
      <button type="button" class="btn-tiny" data-testid="tiny-action">小目标</button>
    </section>

    <!-- INTENTIONAL Phase 1: overlapping interactive elements -->
    <section class="overlap-stage" data-testid="overlap-stage">
      <button type="button" class="overlap-a" data-testid="overlap-a">A</button>
      <button type="button" class="overlap-b" data-testid="overlap-b">B</button>
    </section>

    <!-- INTENTIONAL Phase 1: zero-size interactive node -->
    <button type="button" class="zero-btn" data-testid="zero-btn">hidden</button>
  </main>

  <footer>
    <p>acceptance-demo</p>
  </footer>
</body>
</html>
